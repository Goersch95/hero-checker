<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — STV On Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #ddd;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 32px 28px;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { font-size: 16px; color: #fff; }
  h1 span { color: #e63030; }
  input[type=password] {
    background: #252525;
    border: 1px solid #333;
    border-radius: 5px;
    color: #ddd;
    padding: 9px 10px;
    font-size: 13px;
  }
  button {
    background: #e63030;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #c82020; }
  .error { color: #ff5050; font-size: 12px; }
</style>
</head>
<body>
  <form class="box" method="POST" action="/login">
    <h1><span>●</span> STV On — Login</h1>
    <input type="password" name="password" placeholder="Passwort" autofocus required>
    <button type="submit">Anmelden</button>
    <div class="error" id="error" style="display:none;">Falsches Passwort.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
